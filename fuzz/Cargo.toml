[package]
name = "jscycles-fuzz"
version = "0.0.0"
publish = false
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.93"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
# The crates under test, renamed as in the main workspace.
budget = { package = "jscycles-budget", path = "../crates/jscycles-budget", version = "0.5.0" }
config = { package = "jscycles-config", path = "../crates/jscycles-config", version = "0.5.0" }
cycles = { package = "jscycles-cycles", path = "../crates/jscycles-cycles", version = "0.5.0" }
graph = { package = "jscycles-graph", path = "../crates/jscycles-graph", version = "0.5.0" }
import = { package = "jscycles-import", path = "../crates/jscycles-import", version = "0.5.0" }
module_syntax = { package = "jscycles-module-syntax", path = "../crates/jscycles-module-syntax", version = "0.5.0" }
syntax = { package = "jscycles-syntax", path = "../crates/jscycles-syntax", version = "0.5.0" }
serde_json = "1"

[workspace]
members = ["."]

[[bin]]
name = "configuration"
path = "fuzz_targets/configuration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_syntax"
path = "fuzz_targets/source_syntax.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_adapters"
path = "fuzz_targets/text_adapters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph_semantics"
path = "fuzz_targets/graph_semantics.rs"
test = false
doc = false
bench = false
