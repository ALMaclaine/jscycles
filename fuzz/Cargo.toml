[package]
name = "jscycles-fuzz"
version = "0.0.0"
publish = false
license = "MIT OR Apache-2.0"
edition = "2024"
rust-version = "1.93"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "=0.4.13"
# WillBooster forks: the upstream 0.23 grammars reject valid tagged templates
# and `typeof import()` type arguments; see docs/analysis-limits.md. Pinned
# exactly because the forks ship breaking grammar changes in major bumps.
tree-sitter = { package = "willbooster-tree-sitter", version = "=18.0.2" }
tree-sitter-javascript = { package = "willbooster-tree-sitter-javascript", version = "=22.0.1" }
tree-sitter-typescript = { package = "willbooster-tree-sitter-typescript", version = "=26.0.1" }
jscycles = { path = "..", version = "0.2.0" }
serde_json = "1"

[workspace]
members = ["."]

[[bin]]
name = "configuration"
path = "fuzz_targets/configuration.rs"
test = false
doc = false
bench = false

[[bin]]
name = "source_syntax"
path = "fuzz_targets/source_syntax.rs"
test = false
doc = false
bench = false

[[bin]]
name = "text_adapters"
path = "fuzz_targets/text_adapters.rs"
test = false
doc = false
bench = false

[[bin]]
name = "graph_semantics"
path = "fuzz_targets/graph_semantics.rs"
test = false
doc = false
bench = false
