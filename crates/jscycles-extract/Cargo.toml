[package]
name = "jscycles-extract"
description = "Import extraction and resolution for jscycles"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
include = ["src/**", "Cargo.toml"]

[features]
# Local timing reports; see `cargo xtask profile`.
profiling = ["dep:hotpath", "tsconfig/profiling", "workspace/profiling"]

[dependencies]
budget.workspace = true
import.workspace = true
input.workspace = true
module_path.workspace = true
module_syntax.workspace = true
rayon.workspace = true
syntax.workspace = true
tsconfig.workspace = true
workspace.workspace = true
hotpath = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
