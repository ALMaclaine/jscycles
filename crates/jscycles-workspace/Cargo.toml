[package]
name = "jscycles-workspace"
description = "npm, pnpm and TypeScript workspace detection for jscycles"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
include = ["src/**", "Cargo.toml"]

[features]
# Local timing reports; see `cargo xtask profile`.
profiling = ["dep:hotpath", "tsconfig/profiling"]

[dependencies]
budget.workspace = true
glob.workspace = true
input.workspace = true
serde.workspace = true
serde-saphyr.workspace = true
serde_json.workspace = true
syntax.workspace = true
thiserror.workspace = true
tsconfig.workspace = true
hotpath = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
