[package]
name = "jscycles-discovery"
description = "JavaScript and TypeScript package discovery for jscycles"
version.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true
include = ["src/**", "Cargo.toml"]

[features]
# Local timing reports; see `cargo xtask profile`.
profiling = ["dep:hotpath", "config/profiling", "workspace/profiling"]

[dependencies]
budget.workspace = true
config.workspace = true
glob.workspace = true
input.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
walkdir.workspace = true
workspace.workspace = true
hotpath = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
