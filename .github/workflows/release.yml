name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  source:
    name: Release commit is on main
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Require the tagged commit to be reachable from main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD

  checks:
    needs: source
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries run on any Linux distribution, glibc or musl.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            name: jscycles-linux-x86_64

          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            name: jscycles-linux-aarch64

          - target: x86_64-apple-darwin
            os: macos-15-intel
            name: jscycles-darwin-x86_64

          - target: aarch64-apple-darwin
            os: macos-15
            name: jscycles-darwin-aarch64

          - target: x86_64-pc-windows-msvc
            os: windows-2025
            name: jscycles-windows-x86_64.exe

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.1"
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Install musl tools
        if: endsWith(matrix.target, '-linux-musl')
        run: sudo apt-get update && sudo apt-get install --yes musl-tools

      - name: Build optimized release binary
        env:
          # The tree-sitter grammars are C; compile them against musl too.
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Verify release artifact exists
        if: runner.os != 'Windows'
        run: test -x target/${{ matrix.target }}/release/jscycles

      - name: Verify release artifact exists (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "target/${{ matrix.target }}/release/jscycles.exe")) {
            throw "Missing release binary"
          }

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/jscycles ${{ matrix.name }}

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        run: |
          cp target/${{ matrix.target }}/release/jscycles.exe ${{ matrix.name }}

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.12"

      - name: Test the exact release binary and record build identity
        run: python scripts/release_record.py build --binary ${{ matrix.name }} --name ${{ matrix.name }}

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}
            build-info.json
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only the release binaries: the reused CI workflow uploads other
      # artifacts (coverage reports) to the same run.
      - name: Download the release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: jscycles-*

      - name: Get version
        id: version
        run: |
          python3 - <<'PYTHON'
          import os, tomllib
          version = "v" + tomllib.load(open("Cargo.toml", "rb"))["package"]["version"]
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and os.environ["GITHUB_REF_NAME"] != version:
              raise SystemExit("Release tag does not match Cargo.toml version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"version={version}", file=output)
          PYTHON

      - name: Verify artifact inventory, source identity, and digests
        run: python3 scripts/release_record.py collect

      - name: List artifacts
        run: find artifacts -type f

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: true
          files: |
            SHA256SUMS
            release-metadata.json
            artifacts/jscycles-linux-x86_64/jscycles-linux-x86_64
            artifacts/jscycles-linux-aarch64/jscycles-linux-aarch64
            artifacts/jscycles-darwin-x86_64/jscycles-darwin-x86_64
            artifacts/jscycles-darwin-aarch64/jscycles-darwin-aarch64
            artifacts/jscycles-windows-x86_64.exe/jscycles-windows-x86_64.exe

  npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      # npm trusted publishing: the registry trusts this workflow's OIDC
      # identity, so no npm token is stored. Provenance is attached automatically.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Only the release binaries: the reused CI workflow uploads other
      # artifacts (coverage reports) to the same run.
      - name: Download the release binaries
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          pattern: jscycles-*

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.12"

      # Node 24.22.1 bundles npm 11.19.1; trusted publishing needs npm 11.5.1+.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24.22.1"

      - name: Publish the platform packages, then jscycles
        run: python3 -B scripts/npm_packages.py publish --artifacts artifacts --out target/npm
