name: Publish crate

# Recovery path for the release workflow's crates job: publish the current
# Cargo.toml version to crates.io from main, when the release itself has
# already been published (for 0.2.0, crates.io rejected the first attempt for
# its metadata). Runs only from main, and only for a version that has a GitHub
# release. A version already on crates.io is skipped.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crates:
    name: Publish to crates.io
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      # Trusted publishing, once a publisher is configured for this workflow.
      id-token: write
    env:
      BOOTSTRAP_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: "1.98.1"

      - name: Require main and an existing GitHub release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "run this from main" >&2; exit 1; }
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["package"]["version"])')
          gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Skip a version that is already published
        id: published
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' -H 'User-Agent: jscycles-release (github.com/ALMaclaine/jscycles)' \
            "https://crates.io/api/v1/crates/jscycles/${{ steps.version.outputs.version }}")
          case "$status" in
            200) echo "already on crates.io"; echo "skip=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "unexpected crates.io status $status" >&2; exit 1 ;;
          esac

      - name: Get a trusted-publishing token
        id: auth
        if: steps.published.outputs.skip == 'false' && env.BOOTSTRAP_TOKEN == ''
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      - name: Publish
        if: steps.published.outputs.skip == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
        run: cargo publish --locked
