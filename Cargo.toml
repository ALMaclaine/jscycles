[workspace]
members = ["xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
missing-docs = "warn"
# Existing compiler policy; unsafe code and implicit unsafe operations remain forbidden.
absolute-paths-not-starting-with-crate = "forbid"
elided-lifetimes-in-paths = "forbid"
explicit-outlives-requirements = "forbid"
ffi-unwind-calls = "forbid"
keyword-idents-2018 = "forbid"
keyword-idents-2024 = "forbid"
macro-use-extern-crate = "forbid"
meta-variable-misuse = "forbid"
missing-abi = "forbid"
missing-unsafe-on-extern = "forbid"
non-ascii-idents = "forbid"
redundant-lifetimes = "forbid"
rust-2021-incompatible-closure-captures = "forbid"
rust-2021-incompatible-or-patterns = "forbid"
rust-2021-prefixes-incompatible-syntax = "forbid"
rust-2021-prelude-collisions = "forbid"
rust-2024-incompatible-pat = "forbid"
single-use-lifetimes = "forbid"
trivial-casts = "forbid"
trivial-numeric-casts = "forbid"
unit-bindings = "forbid"
unreachable-code = "allow"              # compiler already handles this
unreachable-pub = "forbid"
unsafe-code = "forbid"
unsafe-op-in-unsafe-fn = "forbid"
unstable-features = "forbid"
unused-extern-crates = "deny"           # derive macros trigger this
unused-import-braces = "deny"           # derive compatibility
unused-lifetimes = "deny"               # derive compatibility
unused-macro-rules = "deny"             # derive compatibility
unused-qualifications = "deny"          # derive macros trigger this
unused-results = "deny"                 # derive compatibility
variant-size-differences = "forbid"

[workspace.lints.rustdoc]
broken-intra-doc-links = "deny"
private-intra-doc-links = "deny"

[workspace.lints.clippy]
# ============================================================================
# CLIPPY LINT GROUPS
# ============================================================================

# Groups at deny (not forbid) so individual lints and macros can override
all = { level = "deny", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
style = { level = "deny", priority = -1 }
complexity = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Conflicts with the compiler's forbid(unreachable_pub): private module items
# deliberately retain crate visibility rather than advertising a public API.
redundant_pub_crate = "allow"

# ============================================================================
# RESTRICTION LINTS - all allow-by-default, we leave them that way
# ============================================================================
# Restriction lints are opinionated style lints. Instead of enabling all 130+
# and then fighting them, we only enable the ones that catch real bugs.

# Catch real bugs
error_impl_error = "deny"
float_cmp_const = "deny"
get_unwrap = "deny"
infinite_loop = "deny"
lossy_float_literal = "deny"
map_err_ignore = "deny"
mem_forget = "deny"
mixed_read_write_in_expression = "deny"
panic_in_result_fn = "deny"
rc_mutex = "deny"
shadow_unrelated = "deny"
string_slice = "deny"
suspicious_xor_used_as_pow = "deny"
unwrap_in_result = "deny"

# Agent guardrails - prevent common shortcuts
allow_attributes_without_reason = "deny"  # justified allow/expect attributes need a reason
as_conversions = "deny"                   # use From/TryFrom/into() instead of `as`
clone_on_ref_ptr = "deny"                 # use Arc::clone() not .clone()
format_push_string = "deny"              # use write!/push_str not format! in loops
indexing_slicing = "deny"                 # use .get() and handle None (tests override)
verbose_file_reads = "deny"              # use fs::read_to_string
wildcard_enum_match_arm = "deny"         # handle all variants explicitly

# Good discipline (tests override via clippy.toml)
expect_used = "deny"
missing_assert_message = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
unwrap_used = "deny"

# Don't commit debug/incomplete code
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unimplemented = "deny"

[package]
name = "jscycles"
publish = ["crates-io"]
version = "0.3.0"
edition.workspace = true
rust-version.workspace = true
description = "Find circular imports between files and workspace packages in JavaScript and TypeScript projects"
readme = "README.md"
include = ["src/**", "tests/**", "/README.md", "/CHANGELOG.md", "/jscycles.schema.json", "/LICENSE-*", "/clippy.toml", "/rustfmt.toml", "Cargo.toml", "Cargo.lock"]
repository = "https://github.com/ALMaclaine/jscycles"
license.workspace = true
keywords = ["javascript", "typescript", "circular-imports", "dependency-cycles", "static-analysis"]
categories = ["development-tools", "command-line-utilities"]

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

[[bin]]
name = "jscycles"
path = "src/main.rs"

[features]
default = []
# Local timing reports are opt-in; normal builds contain no profiler.
profiling = ["dep:hotpath"]

[dependencies]
hotpath = { version = "=0.28.6", optional = true, default-features = false, features = ["hotpath"] }
# CLI
clap = "4"

# Config parsing
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = { version = "2.1.1", default-features = false, features = ["deserialize"] }

# Glob matching for package filters
glob = "0.3"

# File walking
walkdir = "2"

# Error handling
thiserror = "2"

# AST parsing
# WillBooster forks: the upstream 0.23 grammars reject valid tagged templates
# and `typeof import()` type arguments; see docs/analysis-limits.md. Pinned
# exactly because the forks ship breaking grammar changes in major bumps.
tree-sitter = { package = "willbooster-tree-sitter", version = "=18.0.2" }
tree-sitter-javascript = { package = "willbooster-tree-sitter-javascript", version = "=22.0.1" }
tree-sitter-typescript = { package = "willbooster-tree-sitter-typescript", version = "=26.0.1" }

# Parallelism
rayon = "1.10"

[dev-dependencies]
tempfile = "3"
insta = "1"

[lints]
workspace = true
