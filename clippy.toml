# Settings for enabled lints; Cargo.toml selects lint levels.
msrv = "1.93.0"
allow-expect-in-tests = true
allow-unwrap-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = false
allow-dbg-in-tests = false
check-incompatible-msrv-in-tests = true
avoid-breaking-exported-api = true
# Review guards held across await if async code is ever introduced. Owning a
# synchronous mutex alone is valid; no Tokio synchronization policy is selected.
