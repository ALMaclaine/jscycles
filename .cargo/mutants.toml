# Reviewed equivalent mutants only; see docs/quality-engineering.md.
# Positions are deliberate: moving/changing the implementation requires review.
# A backslash outside a JSON string already makes the document invalid. Skipping
# its following byte cannot make the retained backslash valid JSON.
exclude_re = [
  '^src/syntax\.rs:128:22: replace match guard string with true in jsonc$',
  '^src/syntax\.rs:174:22: replace match guard string with true in jsonc$',
  # After both delimiter bytes have been blanked, these mutations merely rescan
  # one or two spaces. They preserve values, offsets and linear progress.
  '^src/syntax\.rs:143:24: replace \+= with -= in jsonc$',
  '^src/syntax\.rs:143:24: replace \+= with \*= in jsonc$',
  '^src/syntax\.rs:150:32: replace \+= with -= in jsonc$',
  '^src/syntax\.rs:150:32: replace \+= with \*= in jsonc$',
  # Recomputing SCCs for a one-node suffix cannot add a package cycle. The
  # extra bookkeeping has no fixed public work-unit contract. Exhaustive cycle
  # oracles and bounded deep-ring tests cover the meaningful behavior.
  '^src/analysis\.rs:488:28: replace > with >= in elementary$',
  # Always following a regular entry returns the same metadata on a stable
  # checkout. It adds a redundant stat; it cannot change the classification.
  # The false guard is retained: a selected symlink prefix must be followed.
  '^src/input\.rs:13:25: replace match guard metadata.file_type\(\).is_symlink\(\) with true in optional_metadata$',
]
